[project]
name = "google-cloud-adk-sre-control-governor"
version = "0.1.0"
description = "Control-theoretic autonomous Google Cloud SRE & BigQuery slot governance workflow built with Google ADK 2.2 Graph Workflows, Gemini 3.8 Flash / Gemini 4, Cloud SDP, and Cloud Spanner TrueTime."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aniket Agrawal", email = "aniketagrawal2012@users.noreply.github.com" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[gcp]>=2.2.0,<3.0.0",
    "google-genai>=2.8.0,<3.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0",
    "pydantic>=2.8.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
